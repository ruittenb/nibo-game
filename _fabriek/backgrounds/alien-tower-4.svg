<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520">
  <defs>
    <linearGradient id="concrete" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2d2f"/>
      <stop offset="50%" stop-color="#383c3e"/>
      <stop offset="100%" stop-color="#2a2d2f"/>
    </linearGradient>
    <linearGradient id="floorSlab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2224"/>
      <stop offset="50%" stop-color="#2c3133"/>
      <stop offset="100%" stop-color="#1e2224"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tower walls -->
  <rect x="80" y="60" width="160" height="430" fill="url(#concrete)" rx="3"/>
  <rect x="80" y="60" width="12" height="430" fill="#1e2224" opacity="0.5" rx="2"/>
  <rect x="228" y="60" width="12" height="430" fill="#1e2224" opacity="0.5" rx="2"/>

  <!-- Floor slabs -->
  <rect x="76" y="462" width="168" height="12" fill="url(#floorSlab)" rx="1"/>
  <rect x="76" y="360" width="168" height="12" fill="url(#floorSlab)" rx="1"/>
  <rect x="76" y="260" width="168" height="12" fill="url(#floorSlab)" rx="1"/>
  <rect x="76" y="162" width="168" height="12" fill="url(#floorSlab)" rx="1"/>

  <!-- Observation deck overhang -->
  <rect x="60" y="70" width="200" height="14" fill="url(#floorSlab)" rx="2"/>
  <rect x="60" y="82" width="200" height="3" fill="#151819" opacity="0.7"/>

  <!-- Deck railing -->
  <rect x="62" y="58" width="196" height="14" fill="#2a2d2f" rx="2"/>
  <rect x="62" y="58" width="196" height="3" fill="#00e5cc" opacity="0.25" rx="1" filter="url(#glow)"/>
  <rect x="70"  y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="95"  y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="120" y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="145" y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="170" y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="195" y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="220" y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="245" y="58" width="3" height="14" fill="#1a1c1e"/>

  <!-- Antenna -->
  <rect x="158" y="18" width="4" height="42" fill="#2a2d2f"/>
  <circle cx="160" cy="16" r="5" fill="#00e5cc" opacity="0.9" filter="url(#glow)"/>
  <circle cx="160" cy="16" r="9" fill="none" stroke="#00e5cc" stroke-width="0.8" opacity="0.4"/>

  <!-- GROUND FLOOR -->
  <!-- Door (moved left) -->
  <rect x="92" y="412" width="40" height="50" rx="2" fill="#111315" stroke="#1e2a2a" stroke-width="1"/>
  <rect x="92" y="412" width="40" height="4" fill="#00e5cc" opacity="0.4" filter="url(#glow)"/>
  <!-- Green/red lights on door -->
  <circle cx="104" cy="437" r="2.5" fill="#00ff88" opacity="0.9" filter="url(#glow)"/>
  <circle cx="113" cy="437" r="2.5" fill="#ff4400" opacity="0.8" filter="url(#glow)"/>

  <!-- Right window (widened) -->
  <rect x="155" y="413" width="70" height="3" fill="#00e5cc" opacity="0.3" filter="url(#glow)"/>
  <rect x="155" y="415" width="70" height="36" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="155" y="415" width="70" height="36" rx="2" fill="#00aaff" opacity="0.1"/>
  <!-- Window cross-bar -->
  <line x1="190" y1="415" x2="190" y2="451" stroke="#1a3040" stroke-width="1"/>
  <line x1="155" y1="433" x2="225" y2="433" stroke="#1a3040" stroke-width="1"/>

  <!-- 1ST FLOOR -->
  <rect x="96" y="318" width="54" height="42" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="170" y="318" width="54" height="42" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="96"  y="318" width="54" height="42" rx="2" fill="#0044ff" opacity="0.07"/>
  <rect x="170" y="318" width="54" height="42" rx="2" fill="#0044ff" opacity="0.07"/>
  <line x1="123" y1="318" x2="123" y2="360" stroke="#1a3040" stroke-width="1"/>
  <line x1="96"  y1="339" x2="150" y2="339" stroke="#1a3040" stroke-width="1"/>
  <line x1="197" y1="318" x2="197" y2="360" stroke="#1a3040" stroke-width="1"/>
  <line x1="170" y1="339" x2="224" y2="339" stroke="#1a3040" stroke-width="1"/>
  <rect x="96"  y="316" width="54" height="3" fill="#00e5cc" opacity="0.3" filter="url(#glow)"/>
  <rect x="170" y="316" width="54" height="3" fill="#00e5cc" opacity="0.3" filter="url(#glow)"/>

  <!-- 2ND FLOOR -->
  <rect x="105" y="218" width="110" height="42" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="105" y="218" width="110" height="42" rx="2" fill="#0055aa" opacity="0.08"/>
  <line x1="160" y1="218" x2="160" y2="260" stroke="#1a3040" stroke-width="1"/>
  <line x1="105" y1="239" x2="215" y2="239" stroke="#1a3040" stroke-width="1"/>
  <text x="90" y="246" font-size="13" fill="#cc00ff" opacity="0.6" font-family="monospace">⬡</text>
  <text x="225" y="246" font-size="13" fill="#cc00ff" opacity="0.6" font-family="monospace">⬡</text>
  <rect x="100" y="216" width="120" height="2" fill="#00e5cc" opacity="0.35" filter="url(#glow)"/>

  <!-- 3RD FLOOR -->
  <rect x="95"  y="120" width="48" height="42" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="177" y="120" width="48" height="42" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="95"  y="120" width="48" height="42" rx="2" fill="#440088" opacity="0.12"/>
  <rect x="177" y="120" width="48" height="42" rx="2" fill="#440088" opacity="0.12"/>
  <circle cx="103" cy="152" r="2" fill="#00e5cc" opacity="0.8" filter="url(#glow)"/>
  <circle cx="112" cy="152" r="2" fill="#00e5cc" opacity="0.6" filter="url(#glow)"/>
  <circle cx="121" cy="152" r="2" fill="#007777" opacity="0.6"/>
  <circle cx="185" cy="152" r="2" fill="#00e5cc" opacity="0.8" filter="url(#glow)"/>
  <circle cx="194" cy="152" r="2" fill="#00e5cc" opacity="0.5" filter="url(#glow)"/>
  <circle cx="203" cy="152" r="2" fill="#007777" opacity="0.6"/>

  <!-- 4TH FLOOR - observation deck figures -->
  <ellipse cx="100" cy="68" rx="4" ry="5" fill="#111416"/>
  <ellipse cx="100" cy="79" rx="5" ry="7" fill="#111416"/>
  <ellipse cx="220" cy="66" rx="5" ry="6" fill="#111416"/>
  <ellipse cx="220" cy="79" rx="4" ry="7" fill="#111416"/>
  <rect x="64" y="83" width="192" height="2" fill="#00e5cc" opacity="0.4" filter="url(#glow)"/>
</svg>
