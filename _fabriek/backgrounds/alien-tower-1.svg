<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520">
  <defs>
    <linearGradient id="concrete" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2d2f"/>
      <stop offset="50%" stop-color="#383c3e"/>
      <stop offset="100%" stop-color="#2a2d2f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2224"/>
      <stop offset="50%" stop-color="#2c3133"/>
      <stop offset="100%" stop-color="#1e2224"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04080f"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="320" height="520" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="30" cy="25" r="1" fill="white" opacity="0.6"/>
  <circle cx="80" cy="60" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="260" cy="40" r="1" fill="white" opacity="0.7"/>
  <circle cx="290" cy="15" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="20" cy="120" r="0.9" fill="white" opacity="0.3"/>
  <circle cx="300" cy="90" r="1" fill="white" opacity="0.5"/>

  <!-- Ground -->
  <rect x="0" y="490" width="320" height="30" fill="#1a1c1e"/>
  <rect x="0" y="488" width="320" height="4" fill="#252829"/>

  <!-- Tower walls -->
  <rect x="80" y="60" width="160" height="430" fill="url(#concrete)" rx="3"/>
  <rect x="80" y="60" width="12" height="430" fill="#1e2224" opacity="0.5" rx="2"/>
  <rect x="228" y="60" width="12" height="430" fill="#1e2224" opacity="0.5" rx="2"/>

  <!-- Floor slabs -->
  <rect x="76" y="462" width="168" height="12" fill="url(#floor)" rx="1"/>
  <rect x="76" y="360" width="168" height="12" fill="url(#floor)" rx="1"/>
  <rect x="76" y="260" width="168" height="12" fill="url(#floor)" rx="1"/>
  <rect x="76" y="162" width="168" height="12" fill="url(#floor)" rx="1"/>

  <!-- Observation deck overhang -->
  <rect x="60" y="70" width="200" height="14" fill="url(#floor)" rx="2"/>
  <rect x="60" y="82" width="200" height="3" fill="#151819" opacity="0.7"/>

  <!-- Deck railing -->
  <rect x="62" y="58" width="196" height="14" fill="#2a2d2f" rx="2"/>
  <rect x="62" y="58" width="196" height="3" fill="#00e5cc" opacity="0.25" rx="1" filter="url(#glow)"/>
  <rect x="70"  y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="95"  y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="120" y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="145" y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="170" y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="195" y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="220" y="58" width="3" height="14" fill="#1a1c1e"/>
  <rect x="245" y="58" width="3" height="14" fill="#1a1c1e"/>

  <!-- Antenna -->
  <rect x="158" y="18" width="4" height="42" fill="#2a2d2f"/>
  <circle cx="160" cy="16" r="5" fill="#00e5cc" opacity="0.9" filter="url(#glow)"/>
  <circle cx="160" cy="16" r="9" fill="none" stroke="#00e5cc" stroke-width="0.8" opacity="0.4"/>

  <!-- GROUND FLOOR -->
  <rect x="140" y="412" width="40" height="50" rx="2" fill="#111315" stroke="#1e2a2a" stroke-width="1"/>
  <rect x="140" y="412" width="40" height="4" fill="#00e5cc" opacity="0.4" filter="url(#glow)"/>
  <circle cx="154" cy="437" r="2" fill="#00e5cc" opacity="0.8" filter="url(#glow)"/>
  <rect x="92" y="415" width="30" height="36" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="198" y="415" width="30" height="36" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="95" y="420" width="24" height="10" rx="1" fill="#00aaff" opacity="0.15"/>
  <rect x="201" y="420" width="24" height="10" rx="1" fill="#00aaff" opacity="0.15"/>
  <circle cx="100" cy="442" r="2.5" fill="#00ff88" opacity="0.9" filter="url(#glow)"/>
  <circle cx="109" cy="442" r="2.5" fill="#ff4400" opacity="0.8" filter="url(#glow)"/>
  <circle cx="206" cy="442" r="2.5" fill="#00ff88" opacity="0.9" filter="url(#glow)"/>
  <circle cx="215" cy="442" r="2.5" fill="#ffaa00" opacity="0.8" filter="url(#glow)"/>

  <!-- 1ST FLOOR -->
  <rect x="96" y="318" width="54" height="42" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="170" y="318" width="54" height="42" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="96"  y="318" width="54" height="42" rx="2" fill="#0044ff" opacity="0.07"/>
  <rect x="170" y="318" width="54" height="42" rx="2" fill="#0044ff" opacity="0.07"/>
  <line x1="123" y1="318" x2="123" y2="360" stroke="#1a3040" stroke-width="1"/>
  <line x1="96"  y1="339" x2="150" y2="339" stroke="#1a3040" stroke-width="1"/>
  <line x1="197" y1="318" x2="197" y2="360" stroke="#1a3040" stroke-width="1"/>
  <line x1="170" y1="339" x2="224" y2="339" stroke="#1a3040" stroke-width="1"/>
  <rect x="96"  y="316" width="54" height="3" fill="#00e5cc" opacity="0.3" filter="url(#glow)"/>
  <rect x="170" y="316" width="54" height="3" fill="#00e5cc" opacity="0.3" filter="url(#glow)"/>

  <!-- 2ND FLOOR -->
  <rect x="105" y="218" width="110" height="42" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="105" y="218" width="110" height="42" rx="2" fill="#0055aa" opacity="0.08"/>
  <line x1="160" y1="218" x2="160" y2="260" stroke="#1a3040" stroke-width="1"/>
  <line x1="105" y1="239" x2="215" y2="239" stroke="#1a3040" stroke-width="1"/>
  <text x="90" y="246" font-size="13" fill="#00e5cc" opacity="0.5" font-family="monospace">⬡</text>
  <text x="225" y="246" font-size="13" fill="#00e5cc" opacity="0.5" font-family="monospace">⬡</text>
  <rect x="100" y="258" width="120" height="2" fill="#00e5cc" opacity="0.35" filter="url(#glow)"/>

  <!-- 3RD FLOOR -->
  <rect x="95"  y="120" width="48" height="42" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="177" y="120" width="48" height="42" rx="2" fill="#0a1520" stroke="#1a3040" stroke-width="1"/>
  <rect x="95"  y="120" width="48" height="42" rx="2" fill="#440088" opacity="0.12"/>
  <rect x="177" y="120" width="48" height="42" rx="2" fill="#440088" opacity="0.12"/>
  <circle cx="103" cy="152" r="2" fill="#cc00ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="112" cy="152" r="2" fill="#cc00ff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="121" cy="152" r="2" fill="#440088" opacity="0.6"/>
  <circle cx="185" cy="152" r="2" fill="#cc00ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="194" cy="152" r="2" fill="#cc00ff" opacity="0.5" filter="url(#glow)"/>
  <circle cx="203" cy="152" r="2" fill="#440088" opacity="0.6"/>

  <!-- 4TH FLOOR - observation deck figures -->
  <ellipse cx="100" cy="68" rx="4" ry="5" fill="#111416"/>
  <ellipse cx="100" cy="79" rx="5" ry="7" fill="#111416"/>
  <ellipse cx="220" cy="66" rx="5" ry="6" fill="#111416"/>
  <ellipse cx="220" cy="79" rx="4" ry="7" fill="#111416"/>
  <rect x="64" y="83" width="192" height="2" fill="#00e5cc" opacity="0.4" filter="url(#glow)"/>

  <!-- Floor labels -->
  <text x="53" y="444" text-anchor="end" font-size="8" fill="#446655" font-family="monospace">GF</text>
  <text x="53" y="344" text-anchor="end" font-size="8" fill="#446655" font-family="monospace">1F</text>
  <text x="53" y="246" text-anchor="end" font-size="8" fill="#446655" font-family="monospace">2F</text>
  <text x="53" y="148" text-anchor="end" font-size="8" fill="#446655" font-family="monospace">3F</text>
  <text x="53" y="76"  text-anchor="end" font-size="8" fill="#446655" font-family="monospace">4F</text>
  <line x1="56" y1="441" x2="78" y2="441" stroke="#223333" stroke-width="0.8"/>
  <line x1="56" y1="341" x2="78" y2="341" stroke="#223333" stroke-width="0.8"/>
  <line x1="56" y1="241" x2="78" y2="241" stroke="#223333" stroke-width="0.8"/>
  <line x1="56" y1="143" x2="78" y2="143" stroke="#223333" stroke-width="0.8"/>
  <line x1="56" y1="72"  x2="78" y2="72"  stroke="#223333" stroke-width="0.8"/>
</svg>
