    <g fill="#1a1d35">
      <rect x="658" y="462" width="18" height="12" rx="3"/>
      <rect x="682" y="462" width="18" height="12" rx="3"/>
      <rect x="706" y="462" width="18" height="12" rx="3"/>
      <rect x="730" y="462" width="18" height="12" rx="3"/>
    </g>
  </g>

  <!-- Electrical box -->
  <g>
    <rect x="740" y="130" width="58" height="80" rx="4" fill="#161930"/>
    <rect x="740" y="130" width="58" height="6"  rx="4" fill="#1e2140"/>
    <rect x="748" y="143" width="42" height="25" rx="2" fill="#0b0c1c"/>
    <g fill="#1c1f38">
      <rect x="748" y="175" width="18" height="12" rx="2"/>
