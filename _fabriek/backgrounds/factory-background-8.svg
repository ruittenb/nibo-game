    <!-- Dials -->
    <circle cx="94"  cy="462" r="11" fill="url(#gaugeGrad)"/>
    <circle cx="94"  cy="462" r="7"  fill="#0e0f23"/>
    <line x1="94"  y1="462" x2="98"  y2="457" stroke="#3a3f6e" stroke-width="1.5"/>
    <circle cx="122" cy="462" r="11" fill="url(#gaugeGrad)"/>
    <circle cx="122" cy="462" r="7"  fill="#0e0f23"/>
    <line x1="122" y1="462" x2="118" y2="457" stroke="#3a3f6e" stroke-width="1.5"/>
    <circle cx="150" cy="462" r="11" fill="url(#gaugeGrad)"/>
    <circle cx="150" cy="462" r="7"  fill="#0e0f23"/>
    <line x1="150" y1="462" x2="154" y2="457" stroke="#3a3f6e" stroke-width="1.5"/>
    <g fill="#1c1f38">
      <rect x="82"  y="480" width="22" height="14" rx="3"/>
      <rect x="110" y="480" width="22" height="14" rx="3"/>
      <rect x="138" y="480" width="22" height="14" rx="3"/>
    </g>
    <g fill="#1a1d35">
      <rect x="82"  y="500" width="22" height="14" rx="3"/>
      <rect x="110" y="500" width="22" height="14" rx="3"/>
      <rect x="138" y="500" width="22" height="14" rx="3"/>
    </g>
  </g>

  <!-- Pump / compressor unit -->
  <g>
    <rect x="160" y="420" width="130" height="80" rx="6" fill="#161930"/>
    <rect x="165" y="425" width="60"  height="70" rx="30" fill="url(#kettleGrad)"/>
    <ellipse cx="195" cy="425" rx="30" ry="12" fill="#252848"/>
    <circle cx="195" cy="455" r="18" fill="#0e0f23"/>
    <circle cx="195" cy="455" r="13" fill="#111325"/>
    <circle cx="195" cy="455" r="5"  fill="#1e2140"/>
    <g fill="none" stroke="#1e2140" stroke-width="3" stroke-linecap="round">
      <line x1="195" y1="442" x2="195" y2="435"/>
      <line x1="208" y1="455" x2="215" y2="455"/>
      <line x1="195" y1="468" x2="195" y2="475"/>
      <line x1="182" y1="455" x2="175" y2="455"/>
    </g>
    <g fill="#1e2140">
      <rect x="226" y="448" width="30" height="14" rx="4"/>
      <rect x="266" y="472" width="10" height="30" rx="3"/>
      <rect x="282" y="447" width="14" height="10" rx="3"/>
    </g>
    <rect x="256" y="435" width="30" height="40" rx="5" fill="#1c1f38"/>
    <circle cx="270" cy="450" r="8" fill="url(#gaugeGrad)"/>
    <circle cx="270" cy="450" r="5" fill="#0e0f23"/>
    <line x1="270" y1="450" x2="273" y2="446" stroke="#3a3f6e" stroke-width="1.2"/>
  </g>

  <!-- Heat exchanger -->
  <g>
    <rect x="480" y="385" width="160" height="55" rx="10" fill="url(#kettleGrad)"/>
    <g fill="#252848">
      <ellipse cx="480" cy="412" rx="18" ry="27"/>
      <ellipse cx="640" cy="412" rx="18" ry="27"/>
    </g>
    <g fill="#1a1d35">
      <circle cx="480" cy="393" r="3"/>
      <circle cx="480" cy="431" r="3"/>
      <circle cx="470" cy="412" r="3"/>
      <circle cx="640" cy="393" r="3"/>
      <circle cx="640" cy="431" r="3"/>
      <circle cx="650" cy="412" r="3"/>
      <rect x="495" y="436" width="18" height="30" rx="3"/>
      <rect x="605" y="436" width="18" height="30" rx="3"/>
    </g>
    <g fill="#1e2140" opacity="0.5">
      <rect x="530" y="388" width="5" height="49" rx="1"/>
      <rect x="560" y="388" width="5" height="49" rx="1"/>
      <rect x="590" y="388" width="5" height="49" rx="1"/>
    </g>
    <g fill="#1e2140">
      <rect x="510" y="370" width="12" height="18" rx="3"/>
      <rect x="600" y="370" width="12" height="18" rx="3"/>
    </g>
    <circle cx="558" cy="407" r="9" fill="url(#gaugeGrad)"/>
    <circle cx="558" cy="407" r="6" fill="#0e0f23"/>
    <line x1="558" y1="407" x2="561" y2="403" stroke="#3a3f6e" stroke-width="1.2"/>
  </g>

  <!-- Control station — right panel -->
  <g>
    <rect x="648" y="335" width="108" height="145" rx="5" fill="#161930"/>
    <rect x="648" y="335" width="108" height="8"   rx="5" fill="#1e2140"/>
    <rect x="658" y="352" width="88"  height="50"  rx="3" fill="#0b0c1c"/>
    <rect x="661" y="355" width="82"  height="44"  rx="2" fill="#0d0e1f"/>
    <g fill="#1a1d35" opacity="0.4">
      <rect x="661" y="362" width="82" height="2"/>
      <rect x="661" y="370" width="82" height="2"/>
      <rect x="661" y="378" width="82" height="2"/>
    </g>
    <!-- Dials -->
    <circle cx="670" cy="422" r="12" fill="url(#gaugeGrad)"/>
    <circle cx="670" cy="422" r="8"  fill="#0e0f23"/>
    <line x1="670" y1="422" x2="674" y2="417" stroke="#3a3f6e" stroke-width="1.5"/>
    <circle cx="702" cy="422" r="12" fill="url(#gaugeGrad)"/>
    <circle cx="702" cy="422" r="8"  fill="#0e0f23"/>
    <line x1="702" y1="422" x2="706" y2="418" stroke="#3a3f6e" stroke-width="1.5"/>
    <circle cx="736" cy="422" r="12" fill="url(#gaugeGrad)"/>
    <circle cx="736" cy="422" r="8"  fill="#0e0f23"/>
    <line x1="736" y1="422" x2="740" y2="418" stroke="#3a3f6e" stroke-width="1.5"/>
    <g fill="#1c1f38">
