<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="filter: brightness(1.5)">
  <defs>
    <filter id="blurFar" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="blurMid" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <linearGradient id="pipeH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e3255"/>
      <stop offset="40%" stop-color="#3a3f6e"/>
      <stop offset="100%" stop-color="#141628"/>
    </linearGradient>
    <linearGradient id="pipeV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141628"/>
      <stop offset="40%" stop-color="#3a3f6e"/>
      <stop offset="100%" stop-color="#1e2140"/>
    </linearGradient>
    <linearGradient id="tankGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141628"/>
      <stop offset="30%" stop-color="#252848"/>
      <stop offset="70%" stop-color="#252848"/>
      <stop offset="100%" stop-color="#141628"/>
    </linearGradient>
    <linearGradient id="kettleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#181b30"/>
      <stop offset="35%" stop-color="#2e3255"/>
      <stop offset="65%" stop-color="#2e3255"/>
      <stop offset="100%" stop-color="#181b30"/>
    </linearGradient>
    <radialGradient id="gaugeGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2a2e50"/>
      <stop offset="100%" stop-color="#0e0f23"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b1a"/>
      <stop offset="100%" stop-color="#0e0f23"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- FAR BACKGROUND -->
  <g filter="url(#blurFar)" opacity="0.7">
    <!-- Huge central silo -->
    <rect x="310" y="30" width="180" height="430" rx="6" fill="#151728"/>
    <ellipse cx="400" cy="30" rx="90" ry="22" fill="#1a1d35"/>
    <g fill="#191c32">
      <rect x="310" y="100" width="180" height="8"/>
      <rect x="310" y="180" width="180" height="8"/>
      <rect x="310" y="260" width="180" height="8"/>
      <rect x="310" y="340" width="180" height="8"/>
    </g>

    <!-- Left tower -->
    <rect x="20" y="60" width="90" height="450" rx="5" fill="#131525"/>
    <ellipse cx="65" cy="60" rx="45" ry="18" fill="#191c32"/>

    <!-- Right tower -->
    <rect x="690" y="40" width="110" height="470" rx="5" fill="#131525"/>
    <ellipse cx="745" cy="40" rx="55" ry="20" fill="#191c32"/>
    <g fill="#181b2e">
      <rect x="690" y="130" width="110" height="10"/>
      <rect x="690" y="240" width="110" height="10"/>
      <rect x="690" y="360" width="110" height="10"/>
    </g>

    <!-- Chimney stacks -->
    <g fill="#121424">
      <rect x="200" y="10" width="30" height="280" rx="4"/>
      <rect x="570" y="0"  width="35" height="250" rx="4"/>
    </g>
    <g fill="#181b2e">
      <ellipse cx="215" cy="10"  rx="18" ry="7"/>
      <ellipse cx="587" cy="0"   rx="20" ry="8"/>
    </g>
  </g>

  <!-- Pipe bundles -->
  <rect x="0" y="58"  width="800" height="14" rx="7"  fill="url(#pipeH)"/>
  <rect x="0" y="115" width="800" height="18" rx="9"  fill="url(#pipeH)"/>
  <rect x="0" y="290" width="800" height="14" rx="7"  fill="url(#pipeH)"/>
  <rect x="0" y="317" width="800" height="18" rx="9"  fill="url(#pipeH)"/>
  <rect x="0" y="490" width="800" height="16" rx="8"  fill="url(#pipeH)"/>

  <!-- Diagonal branch pipes -->
  <g fill="#1e2140">
    <rect x="10" y="140" width="210" height="12" rx="6" transform="rotate(-18 90 146)"/>
    <rect x="370"  y="280" width="160" height="10" rx="5" transform="rotate(14 450 285)"/>
    <rect x="0"    y="490" width="180" height="10" rx="5" transform="rotate(20 90 495)"/>
    <rect x="600"  y="480" width="200" height="10" rx="5" transform="rotate(-16 740 485)"/>
  </g>
  <rect x="580" y="115" width="220" height="11" rx="5" transform="rotate(-10 690 120)" fill="#1a1d35"/>

  <!-- VERTICAL PIPES -->
  <rect x="44"  y="0" width="22" height="600" rx="11" fill="url(#pipeV)"/>
  <rect x="50"  y="0" width="6"  height="600" rx="3"  fill="#2e3255" opacity="0.5"/>
  <rect x="248" y="0" width="20" height="600" rx="10" fill="url(#pipeV)"/>
  <rect x="378" y="0" width="26" height="600" rx="13" fill="url(#pipeV)"/>
  <rect x="385" y="0" width="6"  height="600" rx="3"  fill="#2e3255" opacity="0.4"/>
  <rect x="574" y="0" width="24" height="600" rx="12" fill="url(#pipeV)"/>
  <rect x="580" y="0" width="5"  height="600" rx="2"  fill="#2e3255" opacity="0.5"/>
  <rect x="718" y="0" width="18" height="600" rx="9"  fill="url(#pipeV)"/>

  <!-- PIPE JOINTS / FLANGES -->
  <g fill="#252848">
    <rect x="78"  y="55"  width="12" height="22" rx="2"/>
    <rect x="198" y="55"  width="12" height="22" rx="2"/>
    <rect x="318" y="55"  width="12" height="22" rx="2"/>
    <rect x="438" y="55"  width="12" height="22" rx="2"/>
    <rect x="558" y="55"  width="12" height="22" rx="2"/>
    <rect x="678" y="55"  width="12" height="22" rx="2"/>
    <rect x="78"  y="286" width="12" height="22" rx="2"/>
    <rect x="248" y="286" width="12" height="22" rx="2"/>
    <rect x="438" y="286" width="12" height="22" rx="2"/>
    <rect x="608" y="286" width="12" height="22" rx="2"/>
  </g>

  <!-- VALVES -->
  <!-- Valve 1 -->
  <rect x="112" y="61" width="20" height="16" rx="2" fill="#1e2140"/>
  <rect x="119" y="52" width="6"  height="10" fill="#252848"/>
  <ellipse cx="122" cy="51" rx="9" ry="4" fill="#2a2e50"/>
  <!-- Valve 2 -->
  <rect x="355" y="61" width="20" height="16" rx="2" fill="#1e2140"/>
  <rect x="362" y="52" width="6"  height="10" fill="#252848"/>
  <ellipse cx="365" cy="51" rx="9" ry="4" fill="#2a2e50"/>
  <!-- Valve 3 -->
  <rect x="520" y="293" width="20" height="16" rx="2" fill="#1e2140"/>
  <rect x="527" y="284" width="6"  height="10" fill="#252848"/>
  <ellipse cx="530" cy="283" rx="9" ry="4" fill="#2a2e50"/>
  <!-- Valve 4 -->
  <rect x="200" y="293" width="20" height="16" rx="2" fill="#1e2140"/>
  <rect x="207" y="284" width="6"  height="10" fill="#252848"/>
  <ellipse cx="210" cy="283" rx="9" ry="4" fill="#2a2e50"/>
  <!-- Valve 5 -->
  <rect x="340" y="493" width="20" height="16" rx="2" fill="#1e2140"/>
  <rect x="347" y="484" width="6"  height="10" fill="#252848"/>
  <ellipse cx="350" cy="483" rx="9" ry="4" fill="#2a2e50"/>
  <!-- Valve 6 -->
  <rect x="44"  y="220" width="22" height="18" rx="2" fill="#1e2140"/>
  <rect x="47"  y="213" width="16" height="8"  fill="#252848"/>
  <ellipse cx="55" cy="213" rx="10" ry="4" fill="#2a2e50"/>

  <!-- KETTLE A — left side, large boiler -->
  <g>
    <rect x="68" y="165" width="100" height="130" rx="50" fill="url(#kettleGrad)"/>
    <ellipse cx="118" cy="165" rx="50" ry="18" fill="#252848"/>
    <ellipse cx="118" cy="295" rx="50" ry="16" fill="#1a1d35"/>
    <g fill="#1e2140">
      <rect x="74" y="200" width="100" height="7" rx="2"/>
      <rect x="74" y="230" width="100" height="7" rx="2"/>
      <rect x="74" y="260" width="100" height="7" rx="2"/>
    </g>
    <!-- Gauge -->
    <circle cx="118" cy="183" r="11" fill="url(#gaugeGrad)"/>
    <circle cx="118" cy="183" r="7"  fill="#0e0f23"/>
    <line x1="118" y1="183" x2="122" y2="178" stroke="#3a3f6e" stroke-width="1.5"/>
    <!-- Pipe stub + pressure port -->
    <g fill="#1e2140">
      <rect x="112" y="148" width="12" height="20" rx="4"/>
      <rect x="162" y="220" width="20" height="10" rx="4"/>
      <rect x="114" y="132" width="8"  height="10"/>
    </g>
    <rect x="180" y="218" width="16" height="14" rx="2" fill="#252848"/>
    <!-- Safety valve -->
    <rect x="110" y="140" width="16" height="12" rx="3" fill="#252848"/>
    <rect x="108" y="130" width="20" height="5"  rx="2" fill="#2e3255"/>
    <!-- Legs -->
    <g fill="#1a1d35">
      <rect x="84"  y="290" width="10" height="30" rx="3"/>
      <rect x="144" y="290" width="10" height="30" rx="3"/>
    </g>
  </g>

  <!-- KETTLE B — center, tall cylindrical reactor -->
