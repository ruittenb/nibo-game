    <rect x="355" y="155" width="90" height="190" rx="8" fill="url(#kettleGrad)"/>
    <ellipse cx="400" cy="155" rx="45" ry="20" fill="#252848"/>
    <ellipse cx="400" cy="345" rx="45" ry="18" fill="#1a1d35"/>
    <g fill="#1e2140">
      <rect x="357" y="200" width="90" height="6" rx="2"/>
      <rect x="357" y="240" width="90" height="6" rx="2"/>
      <rect x="357" y="280" width="90" height="6" rx="2"/>
    </g>
    <!-- Porthole -->
    <circle cx="400" cy="220" r="15" fill="#0e0f23"/>
    <circle cx="400" cy="220" r="11" fill="#0a0b14"/>
    <circle cx="400" cy="220" r="8"  fill="#0d0e20" opacity="0.7"/>
    <g fill="#1e2140">
      <circle cx="400" cy="205" r="2.5"/>
      <circle cx="400" cy="235" r="2.5"/>
      <circle cx="385" cy="220" r="2.5"/>
      <circle cx="415" cy="220" r="2.5"/>
    </g>
    <!-- Gauge cluster -->
    <circle cx="388" cy="185" r="9" fill="url(#gaugeGrad)"/>
    <circle cx="388" cy="185" r="6" fill="#0e0f23"/>
    <line x1="388" y1="185" x2="391" y2="180" stroke="#3a3f6e" stroke-width="1.5"/>
    <circle cx="412" cy="185" r="9" fill="url(#gaugeGrad)"/>
    <circle cx="412" cy="185" r="6" fill="#0e0f23"/>
    <line x1="412" y1="185" x2="415" y2="181" stroke="#3a3f6e" stroke-width="1.5"/>
    <!-- Agitator shaft -->
    <rect x="396" y="130" width="8"  height="28" rx="3" fill="#1e2140"/>
    <rect x="386" y="125" width="28" height="8"  rx="3" fill="#252848"/>
    <!-- Nozzles -->
    <g fill="#1e2140">
      <rect x="330" y="258" width="28" height="10" rx="4"/>
      <rect x="443" y="300" width="28" height="10" rx="4"/>
    </g>
    <g fill="#252848">
      <rect x="320" y="254" width="12" height="18" rx="3"/>
      <rect x="469" y="296" width="12" height="18" rx="3"/>
    </g>
    <!-- Support saddles -->
    <g fill="#1a1d35">
      <rect x="355" y="340" width="20" height="40" rx="4"/>
      <rect x="425" y="340" width="20" height="40" rx="4"/>
    </g>
  </g>

  <!-- KETTLE C — right side, squat boiler drum -->
  <g>
    <rect x="620" y="185" width="110" height="110" rx="55" fill="url(#kettleGrad)"/>
    <ellipse cx="675" cy="185" rx="55" ry="20" fill="#252848"/>
    <ellipse cx="675" cy="295" rx="55" ry="18" fill="#1a1d35"/>
    <g fill="#1e2140">
      <rect x="624" y="215" width="110" height="6" rx="2"/>
      <rect x="624" y="255" width="110" height="6" rx="2"/>
    </g>
    <!-- Gauges -->
    <circle cx="660" cy="203" r="11" fill="url(#gaugeGrad)"/>
    <circle cx="660" cy="203" r="7"  fill="#0e0f23"/>
    <line x1="660" y1="203" x2="663" y2="198" stroke="#3a3f6e" stroke-width="1.5"/>
    <circle cx="692" cy="203" r="11" fill="url(#gaugeGrad)"/>
    <circle cx="692" cy="203" r="7"  fill="#0e0f23"/>
    <line x1="692" y1="203" x2="695" y2="198" stroke="#3a3f6e" stroke-width="1.5"/>
    <!-- Manhole -->
    <ellipse cx="675" cy="183" rx="20" ry="9" fill="#1e2140"/>
    <ellipse cx="675" cy="183" rx="14" ry="6" fill="#252848"/>
    <g fill="#1a1d35">
      <circle cx="660" cy="179" r="2"/>
      <circle cx="690" cy="179" r="2"/>
      <circle cx="675" cy="174" r="2"/>
    </g>
    <!-- Safety valve -->
    <rect x="668" y="173" width="14" height="10" rx="2" fill="#252848"/>
    <rect x="672" y="163" width="6"  height="12" fill="#1e2140"/>
    <rect x="665" y="161" width="20" height="5"  rx="2" fill="#2e3255"/>
    <!-- Pipe stubs -->
    <g fill="#1e2140">
      <rect x="568" y="228" width="56" height="10" rx="4"/>
      <rect x="730" y="243" width="40" height="10" rx="4"/>
    </g>
    <!-- Legs -->
    <g fill="#1a1d35">
      <rect x="635" y="290" width="12" height="35" rx="3"/>
      <rect x="703" y="290" width="12" height="35" rx="3"/>
    </g>
  </g>

  <!-- KETTLE D — small kettle upper-right -->
  <g>
    <rect x="520" y="65" width="50" height="70" rx="25" fill="url(#kettleGrad)"/>
    <ellipse cx="545" cy="65"  rx="25" ry="10" fill="#252848"/>
    <ellipse cx="545" cy="135" rx="25" ry="9"  fill="#1a1d35"/>
    <g fill="#1e2140">
      <rect x="522" y="90"  width="50" height="5" rx="1"/>
      <rect x="522" y="108" width="50" height="5" rx="1"/>
      <rect x="540" y="50"  width="10" height="18" rx="3"/>
    </g>
    <circle cx="545" cy="80" r="7" fill="url(#gaugeGrad)"/>
    <circle cx="545" cy="80" r="4" fill="#0e0f23"/>
    <line x1="545" y1="80" x2="548" y2="77" stroke="#3a3f6e" stroke-width="1.2"/>
  </g>

  <!-- MACHINES / EQUIPMENT -->

  <!-- Control panel — left -->
  <g>
    <rect x="72" y="380" width="100" height="140" rx="5" fill="#161930"/>
    <rect x="72" y="380" width="100" height="8"   rx="5" fill="#1e2140"/>
    <rect x="82" y="396" width="80"  height="45"  rx="3" fill="#0b0c1c"/>
    <rect x="85" y="399" width="74"  height="39"  rx="2" fill="#0d0e1f"/>
    <g fill="#1a1d35" opacity="0.4">
      <rect x="85" y="406" width="74" height="2"/>
      <rect x="85" y="414" width="74" height="2"/>
      <rect x="85" y="422" width="74" height="2"/>
